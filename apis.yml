aid: yoonaai
name: Yoona.ai
description: >-
  Yoona.ai is an enterprise agentic-AI platform for product innovation, originally
  built for the fashion industry. It creates an adaptive "Enterprise Twin" of a
  brand by connecting PLM, ERP, e-commerce and market data into a single intelligence
  layer, then uses AI agents to autonomously generate product designs, optimize
  assortments and validate sell-through. Capabilities include text-to-image and
  sketch-to-design generation, trend and data analysis, and a Sales Confidence
  Algorithm. Integration with a customer's stack (Shopify to SAP) is offered via a
  flexible REST/GraphQL API, but that API is delivered as an Enterprise-tier custom
  integration — there is no public self-serve API, developer portal, or OpenAPI
  specification published as of this enrichment pass. Backed by Techstars.
